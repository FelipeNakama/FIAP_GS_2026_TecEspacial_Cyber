name: DevSecOps Pipeline - Space Debris Monitor
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
 
permissions:
  contents: read        # Zero Trust: minimo privilegio
 
jobs:
  secret-scan:
    name: "Stage 1 - Secret Scan (truffleHog)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historico completo para escanear todos os commits
      - name: Run truffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
 
  dependency-scan:
    name: "Stage 2 - Dependency Scan (pip-audit)"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: pip-audit -r requirements.txt
 
  container-scan:
    name: "Stage 3 - Container Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: dependency-scan
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t space-debris:latest .
      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "space-debris:latest"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
 
  notify-on-failure:
    name: "Stage 4 - Notify on Failure"
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-scan, container-scan]
    if: failure()
    steps:
      - name: Send failure notification
        run: |
          echo "ALERTA: Pipeline de seguranca falhou!"
          echo "Repositorio: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Autor: ${{ github.actor }}"
          echo "(Em producao: enviar e-mail ou webhook Slack usando NASA_API_KEY e outros secrets)"
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
